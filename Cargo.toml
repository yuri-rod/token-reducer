[package]
name = "token-reducer"
version = "0.1.2"
edition = "2021"
description = "Summarize logs, command output, JSON arrays, and Git diffs for coding-agent context"
repository = "https://github.com/yuri-rod/token-reducer"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
colored = "2.1"
tiktoken-rs = "0.5"

[dev-dependencies]
tempfile = "3.10"
